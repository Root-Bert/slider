# Slider on one server: Caddy (HTTPS) → Slider (API + web app) → Postgres.
#
#   cd deploy
#   cp .env.example .env    # SLIDER_DOMAIN and POSTGRES_PASSWORD, see docs/self-hosting.md
#   docker compose up -d --build   # builds the image from this checkout (a few minutes)
#   docker compose logs slider   # → https://<SLIDER_DOMAIN>/einrichtung + "Setup token: …"

name: slider

services:
  slider:
    build:
      context: ..
      dockerfile: Dockerfile
    image: slider:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATA_DIR: /data
      SLIDER_URL: https://${SLIDER_DOMAIN:?SLIDER_DOMAIN is required}
      DATABASE_URL: postgres://slider:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/slider
      # Only Caddy can reach the container, so X-Forwarded-For is trustworthy.
      TRUST_PROXY: '1'
    volumes:
      - slider-data:/data
      # Company fonts (.ttf/.otf) for LibreOffice's slide images; survive image updates.
      - ./fonts:/usr/local/share/fonts/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Not published: only reachable through Caddy.
    expose:
      - '8787'

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: slider
      POSTGRES_USER: slider
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slider -d slider']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: the AI cuts pictures out of their background. Starts with
  # `docker compose --profile rembg up -d` and REMBG_URL=http://rembg:7000 in .env.
  rembg:
    profiles: [rembg]
    build: ./rembg
    image: slider-rembg:local
    restart: unless-stopped
    # Not published: only Slider reaches it. Capped so slides and imports keep their share.
    expose:
      - '7000'
    cpus: 2
    mem_limit: 2g

  # Optional: speech to text on this server (Whisper). Starts with
  # `docker compose --profile stt up -d` and SPEECH_URL=http://stt:8000/v1 in .env.
  stt:
    profiles: [stt]
    build: ./stt
    image: slider-stt:local
    restart: unless-stopped
    # Not published: only Slider reaches it. Capped so slides, imports and calls keep their share.
    expose:
      - '8000'
    cpus: 2
    mem_limit: 3g

  # Optional: a spam filter of this server's own (Rspamd) for the mailboxes Slider reads – it
  # learns, for the whole server, only from what people decide („Als Spam markieren“, „Kein Spam“,
  # their rules). Starts with `docker compose --profile spam up -d` and in .env
  # RSPAMD_URL=http://rspamd:11333 and RSPAMD_PASSWORD (docs/self-hosting.md, „Spamfilter“).
  rspamd:
    profiles: [spam]
    image: rspamd/rspamd:4.2.3
    restart: unless-stopped
    environment:
      # Its controller's password (learning); unset, only Rspamd itself reaches it.
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:-}
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
    # Not published: only Slider reaches it – 11333 checks, 11334 learns.
    expose:
      - '11333'
      - '11334'
    depends_on:
      rspamd-redis:
        condition: service_healthy
      rspamd-dns:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g

  # What Rspamd learned (Bayes) and knows: kept on disk, its oldest words go first when full.
  rspamd-redis:
    profiles: [spam]
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '300',
        '1',
        '--appendonly',
        'no',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'volatile-ttl',
      ]
    volumes:
      - rspamd-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 640m

  # A resolver of its own for Rspamd: DNS blocklists (Spamhaus …) answer no public resolver.
  rspamd-dns:
    profiles: [spam]
    build: ./rspamd/dns
    image: slider-rspamd-dns:local
    restart: unless-stopped
    mem_limit: 128m

  # Optional: calls with many people (up to 50) – LiveKit forwards sound and pictures instead of
  # every browser sending to every other (8 at most). Starts with COMPOSE_PROFILES=call and
  # CALL_DOMAIN=call.example.com in .env: a DNS-only A record for it at this server, and the
  # ports below open (docs/self-hosting.md, „Anrufe mit vielen Personen“). Its key pair is the one
  # Slider makes in its data volume; its signalling goes through Caddy (CALL_DOMAIN's site).
  livekit:
    profiles: [call]
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    # Writes LiveKit's config (keys, TURN with Caddy's certificate, webhook) and starts it.
    entrypoint: ['/bin/sh', '/start.sh']
    environment:
      CALL_DOMAIN: ${CALL_DOMAIN:-}
      # Only if the address LiveKit finds by STUN is not the server's public one.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    ports:
      - '7881:7881' # ICE over TCP, when UDP is blocked
      - '7882:7882/udp' # ICE over UDP: all media through this one port
      - '3478:3478/udp' # TURN over UDP
      - '5349:5349' # TURN over TLS (CALL_DOMAIN's certificate)
    volumes:
      - ./livekit/start.sh:/start.sh:ro
      # Only the key pair's folder of Slider's volume (keys.yaml, made by Slider at its start).
      - type: volume
        source: slider-data
        target: /keys
        read_only: true
        volume:
          subpath: livekit
      # The certificate Caddy gets and renews for CALL_DOMAIN, for TURN over TLS.
      - caddy-data:/caddy:ro
    depends_on:
      slider:
        condition: service_healthy
    # Forwarding only (no transcoding): two cores carry a few calls of up to 50.
    cpus: 2
    mem_limit: 1g

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SLIDER_DOMAIN: ${SLIDER_DOMAIN}
      # Former addresses: browsers go on to SLIDER_DOMAIN, apps are answered (Caddyfile).
      SLIDER_OLD_DOMAINS: ${SLIDER_OLD_DOMAINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Calls with many people (profile `call`): LiveKit's signalling, and its certificate.
      # Unset, a name nobody reaches from outside (Caddy needs a name for the site).
      CALL_DOMAIN: ${CALL_DOMAIN:-call.localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - slider

volumes:
  slider-data:
  postgres-data:
  caddy-data:
  caddy-config:
  rspamd-data:
  rspamd-redis-data:

networks:
  default:
    # Fixed name so other Compose projects on this server can join it behind this Caddy.
    name: slider
