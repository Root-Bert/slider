name: CI

# Two sizes of the same workflow:
#
# - Full, in the development repository: lint, typecheck, build, the Vitest suite (API on PGlite in
#   five groups), e2e, Postgres driver/migrations, Caddyfiles, secret scan and the container image
#   built and smoke-tested. It runs by hand (Actions → CI → Run workflow) and is called by
#   publish.yml before anything is published or deployed – a release whose checks fail goes
#   nowhere.
# - Light, in the public repository Root-Bert/slider, on every release tag publish.yml pushes there:
#   the published tree is complete and builds – lint, typecheck, build, the container image (amd64
#   and arm64) and the secret scan. Only when these pass does its last job turn the tag into a
#   GitHub release.
#   The desktop app is built after that and put on the release with its update feeds: Linux
#   (x64, arm64) always, the Mac (Apple Silicon) once signed with the Apple secrets set there –
#   see the desktop job.
#
# No image is published: self-hosters build it from their checkout (docs/self-hosting.md). Pushes
# to main and pull requests start no run; a tag pushed here starts nothing (publish.yml calls it).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Tag or commit to check (publish.yml passes the release tag)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    if: github.event_name != 'push' || github.repository == 'Root-Bert/slider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vite runs on Node.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  # The Vitest suite on six runners: the API tests in five groups of about equal length
  # (scripts/api-test-group.ts – each test starts its own database, so they dominate), everything
  # else together. The API tests run one at a time: on a 2-core runner two of them, each with its
  # own LibreOffice, ran out of time.
  test:
    name: Tests (${{ matrix.name }})
    if: github.repository != 'Root-Bert/slider' && github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API 1/5
            run: bunx vitest run --project api $(bun scripts/api-test-group.ts 1 5) --maxWorkers=1
          - name: API 2/5
            run: bunx vitest run --project api $(bun scripts/api-test-group.ts 2 5) --maxWorkers=1
          - name: API 3/5
            run: bunx vitest run --project api $(bun scripts/api-test-group.ts 3 5) --maxWorkers=1
          - name: API 4/5
            run: bunx vitest run --project api $(bun scripts/api-test-group.ts 4 5) --maxWorkers=1
          - name: API 5/5
            run: bunx vitest run --project api $(bun scripts/api-test-group.ts 5 5) --maxWorkers=1
          - name: web, packages
            run: bunx vitest run --project web --project web-dom --project pptx --project odp --project shared --maxWorkers=2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest runs on Node.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}

  e2e:
    name: End-to-end (Playwright)
    if: github.repository != 'Root-Bert/slider' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Playwright and Vite run on Node.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: bun run e2e
      # Once more against the production build, served by the API itself (WEB_DIST_DIR) like in
      # the container: built chunks, lazy routes, SPA fallback, document headers.
      - run: bun run e2e:bundle
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  # The production driver, migration idempotency, upserts and transaction rollback.
  # Business behavior is covered by the PGlite suite above instead of repeated here.
  postgres:
    name: Postgres driver and migrations
    if: github.repository != 'Root-Bert/slider' && github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as deploy/docker-compose.yml.
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bunx vitest run --project api apps/api/test/postgres.test.ts --maxWorkers=2

  # Builds the Dockerfile for both platforms self-hosters run and starts each like a self-hoster
  # would. amd64 on every run. arm64 (e.g. Hetzner CAX) is built and run under QEMU, which
  # takes long: only in the public repository, where every release lands as a commit and Actions
  # minutes are free, or on a manual run. Each architecture has its own build cache scope.
  image-smoke:
    name: Container image ${{ matrix.arch }} (build + smoke test)
    if: github.event_name != 'push' || github.repository == 'Root-Bert/slider'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.repository == 'Root-Bert/slider' || github.event_name == 'workflow_dispatch') && '["amd64", "arm64"]' || '["amd64"]') }}
    env:
      SMOKE_PLATFORM: linux/${{ matrix.arch }}
      SMOKE_WAIT: ${{ matrix.arch == 'arm64' && 600 || 90 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: slider:smoke
          cache-from: |
            type=gha,scope=smoke-${{ matrix.arch }}
            type=gha
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.arch }}
      - run: scripts/smoke-image.sh slider:smoke

  # The Caddyfiles of deploy/ (built-in and shared Caddy, with the sites shipped for them),
  # parsed and provisioned by the caddy:2 image Compose runs – with and without Cloudflare.
  caddy:
    name: Caddyfiles (caddy adapt)
    if: github.repository != 'Root-Bert/slider' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - run: scripts/check-caddyfiles.sh

  secrets:
    name: Secret scan
    if: github.event_name != 'push' || github.repository == 'Root-Bert/slider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # Full-history scan with the gitleaks CLI. (gitleaks-action breaks on a repo's first push,
      # where the root commit has no parent to diff against.)
      - name: Scan history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo

  release:
    name: Create the GitHub release
    needs: [verify, image-smoke, secrets]
    if: github.repository == 'Root-Bert/slider' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag \
            --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"

  # The desktop app (desktop/), each build on a runner of its own system and architecture: the
  # API's native packages (@napi-rs/canvas) and the bundled bun are per platform. Linux (AppImage,
  # deb) needs no signing and always goes on the release. The Mac (Apple Silicon only) goes there
  # only signed with the Developer ID and notarized, with the Apple secrets set here (Settings →
  # Secrets → Actions); without them it is built unsigned and kept as a workflow artifact.
  #   CSC_LINK          the Developer ID Application certificate, .p12 as base64
  #   CSC_KEY_PASSWORD  its password
  #   APPLE_API_KEY     App Store Connect API key (.p8 contents) for notarization
  #   APPLE_API_KEY_ID, APPLE_API_ISSUER
  # Each build brings its own update feed (latest-mac.yml, latest-linux.yml,
  # latest-linux-arm64.yml), so none has to be merged.
  desktop:
    name: Desktop app ${{ matrix.os }} ${{ matrix.arch }}
    needs: release
    if: github.repository == 'Root-Bert/slider' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            arch: arm64
            runner: macos-14
            targets: dmg zip
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            targets: AppImage deb
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            targets: AppImage deb
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Build (the Mac signed and notarized when the Apple secrets are set)
        id: build
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          extra=()
          if [ "${{ matrix.os }}" = linux ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CSC_LINK" ]; then
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/notarize.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/notarize.p8"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            extra=(-c.mac.identity=null)
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/stage.mjs
          npx electron-builder --${{ matrix.os }} ${{ matrix.targets }} --${{ matrix.arch }} \
            --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}" "${extra[@]}"
      - if: steps.build.outputs.signed == 'true'
        name: Check signature and notarization
        working-directory: desktop
        run: |
          app=$(find dist -maxdepth 2 -name Slider.app | head -1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
      - if: steps.build.outputs.publish == 'true'
        name: Put the packages and the update feed on the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        # The packages, their blockmaps (updates that load only what changed) and the feed.
        run: >-
          gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          dist/Slider-* dist/latest*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/Slider-*
            desktop/dist/latest*.yml
            !desktop/dist/*.blockmap
          retention-days: 14
