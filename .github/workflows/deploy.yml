name: Deploy

# Publishing a GitHub release deploys its tag to the production server; pushes deploy nothing.
# The product website is not part of it: it deploys on every push to main (deploy-website.yml).
# The job copies the tagged checkout to /opt/slider on the server, writes deploy/.env from a
# secret and runs deploy/deploy.sh there (build, restart, wait for the health check). Nothing has
# to be set up on the server by hand. Runs only in the development repository
# (Root-Bert/slider-dev), never in the public one or a fork.
#
# Repository secrets: DEPLOY_HOST (server IP), DEPLOY_KNOWN_HOSTS (its SSH host key line),
# DEPLOY_SSH_KEY (private key whose public half is in root's authorized_keys there, prefixed with
# `restrict `), DEPLOY_ENV (the whole deploy/.env).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy again, e.g. v1.2.0
        required: true

permissions:
  contents: read

# Deploys queue up instead of cancelling one that is halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the server
    if: github.repository == 'Root-Bert/slider-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" > ~/.ssh/config

      # deploy/.env and the company fonts live only on the server; --delete leaves excluded paths alone.
      - name: Copy the release
        run: |
          rsync -az --delete \
            --exclude=/.git/ --exclude=node_modules/ --exclude=/deploy/.env --exclude=/deploy/fonts/ \
            ./ server:/opt/slider/

      - name: Write deploy/.env
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: printf '%s\n' "$DEPLOY_ENV" | ssh server 'umask 077 && cat > /opt/slider/deploy/.env'

      - name: Build and start
        run: ssh server /opt/slider/deploy/deploy.sh
